AWSTemplateFormatVersion: '2010-09-09'
Description: Cuebox website - private S3, CloudFront OAC, ACM and Route53
Parameters:
  Domain:
    Type: String
    Default: cuebox.gd
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  PublishDNS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  Publish: !Equals [!Ref PublishDNS, 'true']
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 90}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      SubjectAlternativeNames: [!Sub 'www.${Domain}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${Domain}'
          HostedZoneId: !Ref HostedZoneId
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Routing:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Canonical hostname and directory indexes
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.headers.host.value === 'www.${Domain}') {
            var parts = [];
            for (var key in request.querystring) {
              var item = request.querystring[key];
              var values = item.multiValue || [item];
              for (var i = 0; i < values.length; i++) {
                parts.push(key + '=' + values[i].value);
              }
            }
            var query = parts.length ? '?' + parts.join('&') : '';
            return {statusCode: 301, statusDescription: 'Moved Permanently',
              headers: {location: {value: 'https://${Domain}' + request.uri + query}}};
          }
          if (request.uri.endsWith('/')) request.uri += 'index.html';
          else if (request.uri.split('/').pop().indexOf('.') < 0) {
            return {statusCode: 302, statusDescription: 'Found',
              headers: {location: {value: request.uri + '/'}}};
          }
          return request;
        }
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-cache'
        MinTTL: 0
        DefaultTTL: 3600
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-headers'
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: SAMEORIGIN, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, Override: true}
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=()'
              Override: true
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Cuebox public website and original sample game
        Aliases: [!Ref Domain, !Sub 'www.${Domain}']
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: PrivateS3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: PrivateS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt Routing.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  DNS:
    Type: AWS::Route53::RecordSetGroup
    Condition: Publish
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref Domain
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Ref Domain
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Sub 'www.${Domain}'
          Type: A
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
        - Name: !Sub 'www.${Domain}'
          Type: AAAA
          AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}
Outputs:
  BucketName: {Value: !Ref Bucket}
  DistributionId: {Value: !Ref Distribution}
  DistributionDomain: {Value: !GetAtt Distribution.DomainName}
  URL: {Value: !Sub 'https://${Domain}'}
