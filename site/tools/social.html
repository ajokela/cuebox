<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cuebox social card source</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body{width:1200px;height:630px;overflow:hidden}
    main{padding:55px 65px;display:flex;align-items:center;height:630px;gap:30px}
    .copy{flex:1}.brand{margin-bottom:60px}
    h1{font-size:79px;line-height:1.02;letter-spacing:-5px}
    .description{font-size:20px;max-width:440px}
    .eyebrow{margin-top:40px}
    .workshop{width:460px;border:8px solid #18352f;box-shadow:10px 10px 0 #ced7bf;transform:rotate(-2deg)}
  </style>
</head>
<body><main>
  <div class="copy">
    <div class="brand"><img src="../assets/icon.svg" width="46" height="46" alt="">cuebox<span class="orange">.</span></div>
    <h1>Big adventures.<br>Giant pixels<span class="orange">.</span></h1>
    <p class="description">The open-source adventure game framework for Godot.</p>
    <p class="eyebrow">MIT licensed · cuebox.gd</p>
  </div>
  <img class="workshop" src="../assets/workshop.svg" alt="A pixel-art workshop">
</main></body>
</html>
